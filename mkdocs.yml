site_name: Daggerheart Vault
site_url: https://giovanniturra88-sudo.github.io/La-Notte-Eterna-C01/
docs_dir: '.'

theme:
  name: material
  language: it
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search
  - obsidian-support

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed