site_name: Daggerheart Vault
site_url: https://giovanniturra88-sudo.github.io/La-Notte-Eterna-C01/

theme:
  name: material
  language: it
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.highlight
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tabbed
  - wikilinks:
      base_url: ''
      end_url: '/'

plugins:
  - search
  - wikilinks
